[package]
name = "veyra-ledger"
description = "Veyra receipt anchoring: append-only Merkle roots of signed contractor receipts"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
