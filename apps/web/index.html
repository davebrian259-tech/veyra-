<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Veyra Heist · rob an AI agent on NEAR</title>
    <meta name="description" content="Build a rogue agent and rob Veyra, an AI that pays other agents for work. Five vaults, real pots on NEAR, free to practise." />
    <meta property="og:title" content="Veyra Heist" />

    <!-- Apply the saved theme before first paint (dark unless the visitor chose light). -->
    <script>try { document.documentElement.setAttribute("data-theme", localStorage.getItem("veyra.theme") === "light" ? "light" : "dark"); } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }</script>
    <!-- Some wallet SDKs expect Node globals. -->
    <script>window.process = window.process || { env: {}, browser: true, version: "" };</script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
